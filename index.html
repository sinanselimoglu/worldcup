<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Damla Kent — Daire Durumu Özeti</title>

<meta property="og:type" content="website">
<meta property="og:title" content="Damla Kent — Daire Durumu Özeti">
<meta property="og:description" content="Damla Kent projesi daire müsaitlik özeti: satılan, müsait ve rezerve daireler — saatlik güncellenir.">
<meta property="og:url" content="https://www.sinann.com/">
<link rel="canonical" href="https://www.sinann.com/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Damla Kent — Daire Durumu Özeti">
<meta name="twitter:description" content="Daire müsaitlik özeti — saatlik güncellenir.">
<meta name="description" content="Damla Kent projesi daire müsaitlik özeti.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark">🏙️</span>
        <div>
          <h1 id="project-name">Damla Kent</h1>
          <p class="subtitle">Daire Durumu Özeti</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="status-pill">
          <span class="dot"></span>
          <span id="status-line">Yükleniyor…</span>
        </div>
        <button id="refresh-btn" title="Yenile">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
          <span>Yenile</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- Live certificate (stock) price banner -->
    <section class="price-banner" id="price-banner">
      <div class="pb-main">
        <div class="pb-label">Sertifika Güncel Fiyatı · <b>DMLKT.G</b></div>
        <div class="pb-value" id="cert-price">—</div>
        <div class="pb-change" id="cert-change"></div>
      </div>
      <div class="pb-meta" id="cert-meta"></div>
    </section>

    <!-- Headline totals -->
    <section class="stat-row" id="stat-row"></section>

    <!-- Availability bar -->
    <section class="card bar-card">
      <div class="card-title">Genel Doluluk</div>
      <div class="prog" id="prog"></div>
      <div class="prog-legend" id="prog-legend"></div>
    </section>

    <!-- Recent status changes (sold / reserved) -->
    <section class="card">
      <div class="card-title">
        Son Hareketler
        <span class="ct-sub" id="recent-sub"></span>
      </div>
      <div id="recent" class="recent-list"></div>
    </section>

    <!-- Cheapest per room type -->
    <section class="card">
      <div class="card-title">En Uygun Daireler (oda tipine göre, en ucuzdan)</div>
      <div class="cheapest-grid" id="cheapest"></div>
    </section>

    <div class="grid-2">
      <!-- By room type -->
      <section class="card">
        <div class="card-title">Oda Tipine Göre — Başlangıç / En Yüksek Fiyat</div>
        <div id="rooms" class="rooms"></div>
      </section>

      <!-- Highlights -->
      <section class="card">
        <div class="card-title">Bloklar — Özet</div>
        <div id="block-summary" class="block-summary"></div>
      </section>
    </div>

    <!-- All blocks -->
    <section class="card">
      <div class="card-title">Tüm Bloklar (<span id="block-count">0</span>)</div>
      <div class="block-grid" id="blocks"></div>
    </section>
  </main>

  <footer>
    <p>Veri kaynağı: gayrimenkulsertifika.com · Saatlik güncellenir</p>
  </footer>

  <script src="app.js"></script>

  <!-- Cloudflare Web Analytics -->
  <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "d17ec7c62da041b4a98dff717e31d776"}'></script>
  <!-- End Cloudflare Web Analytics -->
</body>
</html>
